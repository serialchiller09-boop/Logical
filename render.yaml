services:
  - type: web
    name: logical
    runtime: node
    buildCommand: npm ci && npm run verify
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: LOGICAL_DATA_DIR
        value: /var/data/logical
      - key: ADMIN_TOKEN
        sync: false
    disk:
      name: logical-data
      mountPath: /var/data
      sizeGB: 1

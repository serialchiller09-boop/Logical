# Change this app name before the first Fly.io deploy, for example:
# app = "logical-your-name"
app = "logical"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  HOST = "0.0.0.0"
  PORT = "8787"
  LOGICAL_DATA_DIR = "/data"

[[mounts]]
  source = "logical_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
